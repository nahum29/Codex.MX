    <script>
      // Aplica el tema antes del primer pintado para evitar un destello.
      (() => {
        let saved;
        try { saved = localStorage.getItem('codex-theme'); } catch {}
        const theme = saved === 'light' || saved === 'dark' ? saved : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
